<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Outer circle border -->
  <circle cx="80" cy="80" r="76" stroke="#FFFFFF" stroke-width="5" fill="#0A192F" />
  
  <!-- Subtle inner ring -->
  <circle cx="80" cy="80" r="70" stroke="#3B82F6" stroke-width="1.5" opacity="0.4" />

  <!-- Sunburst rays originating from the cross base -->
  <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.9">
    <line x1="80" y1="65" x2="80" y2="20" stroke-width="3" />
    <line x1="80" y1="65" x2="52" y2="24" />
    <line x1="80" y1="65" x2="32" y2="40" />
    <line x1="80" y1="65" x2="22" y2="62" />
    <line x1="80" y1="65" x2="26" y2="86" />
    <line x1="80" y1="65" x2="108" y2="24" />
    <line x1="80" y1="65" x2="128" y2="40" />
    <line x1="80" y1="65" x2="138" y2="62" />
    <line x1="80" y1="65" x2="134" y2="86" />
  </g>

  <!-- Hill / Base mound -->
  <path d="M 28 105 Q 80 82 132 105 L 132 135 L 28 135 Z" fill="#0F172A" />

  <!-- Latin Cross -->
  <g fill="#FFFFFF">
    <!-- Vertical beam -->
    <rect x="76" y="38" width="8" height="48" rx="2" />
    <!-- Horizontal beam -->
    <rect x="64" y="50" width="32" height="7.5" rx="2" />
  </g>

  <!-- Banner / Badge for text at bottom -->
  <rect x="42" y="106" width="76" height="30" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="80" y="120" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="800" letter-spacing="1">FTVTI</text>
  <text x="80" y="132" text-anchor="middle" fill="#60A5FA" font-family="Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">ECSF</text>
</svg>
